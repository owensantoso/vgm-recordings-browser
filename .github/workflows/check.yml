name: Check React archive
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install synthetic-media encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run check
      - name: Verify branch-served bundles are current
        run: git diff --exit-code -- assets/ data/catalog.json
      - name: Verify archive media paths
        run: node scripts/check-assets.mjs
